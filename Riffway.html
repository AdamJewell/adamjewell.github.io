<title>Riffway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one 16:9 stage. The canvas draws venue, band, note highway and HUD; menus sit over it. Dark by design. */
:root{
  --bg:#07060b; --panel:#14111c; --panel2:#1d1929; --line:#352e48; --ink:#f3eefc; --muted:#a79fbc;
  --hot:#ffb526; --hot-ink:#1a1003; --bad:#ff4b4b; --good:#3fdc6c;
  --display:"Anton", "Impact", "Arial Narrow Bold", sans-serif;
  --body:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.25}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-inline:16px;padding-block:10px}
.stage{position:relative;width:min(100%, calc((100dvh - 64px) * 16 / 9));max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{margin:0;color:var(--muted);font-size:16px;text-align:center;max-width:100%}
.hint b{color:var(--ink);font-weight:600}
.menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,4,9,.72);padding:3%;overflow:auto}
.menu[hidden]{display:none}
.panel{width:min(100%,560px);max-height:100%;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:4px}
.panel.wide{width:min(100%,760px)}
.logo{font-family:var(--display);font-size:clamp(44px,9vw,96px);line-height:.9;letter-spacing:.02em;margin:0;color:var(--ink);text-transform:uppercase}
.logo span{color:var(--hot)}
.stripe{height:6px;background:repeating-linear-gradient(90deg,var(--hot) 0 34px,transparent 34px 52px);margin-bottom:6px}
.panel h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.4vw,40px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.panel p{margin:0;color:var(--muted)}
.btn{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);padding:8px 14px;cursor:pointer;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.btn small{font-weight:500;font-size:16px;color:var(--muted);text-transform:none;letter-spacing:0;text-align:right}
.btn:hover,.btn:focus-visible{background:var(--panel2);border-left-color:var(--hot)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.go{background:var(--hot);color:var(--hot-ink);border-color:var(--hot)}
.btn.go small{color:var(--hot-ink)}
.tier{font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--hot);margin:8px 0 0}
.tier.locked{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);padding:8px 12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.stars{color:var(--hot);letter-spacing:.1em}
.keys{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.keycap{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:5px;font-weight:700;color:#0b0810}

.dev{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);z-index:10;background:var(--panel);border-left:2px solid var(--hot);box-shadow:-10px 0 30px rgba(0,0,0,.6);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:5px;font-size:17px}
.dev[hidden]{display:none}
.dev-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dev h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;text-transform:uppercase}
.dev h3{margin:10px 0 0;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hot)}
.dev-row{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:baseline}
.dev-row label{font-weight:700}
.dev-row output{font-variant-numeric:tabular-nums;white-space:nowrap}
.dev-row input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--hot);margin:2px 0}
.dev-row small{grid-column:1 / -1;color:var(--muted);font-size:15px;line-height:1.2}
.dev-check{display:flex;align-items:center;gap:7px;cursor:pointer;margin-top:4px}
.dev-check input{accent-color:var(--hot);width:16px;height:16px;margin:0}
.sbtn{border:1px solid var(--line);background:var(--panel2);padding:4px 12px;cursor:pointer;font-weight:600}
.dev .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (max-width:620px){ body{font-size:17px} .btn{font-size:19px;padding:7px 10px} }
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Riffway stage and note highway"></canvas>
    <div class="menu" id="menu"></div>
  </div>
  <p class="hint">Hold frets with <b>A S D F G</b>, strum with <b>Enter</b> or the <b>Up / Down</b> arrows. <b>Esc</b> pauses. Click the game once if keys do nothing.</p>
</div>

  <div id="dev-rows"></div>
  <label class="dev-check" for="dev-overlay"><input type="checkbox" id="dev-overlay"> Show hit window and timing readout</label>
  <div class="row">
    <button type="button" class="sbtn" id="dev-reset">Reset to defaults</button>
    <button type="button" class="sbtn" id="wipe">Wipe saved scores</button>
  </div>
</aside>

// Turn a song into timed events. Everything after this point is in seconds from the start of the song.
function buildSong(song){
  const u = song.unit, lead = [], bars = []; let b = 0;
  const add = str => { for (const tok of str.trim().split(/\s+/)) { const [n, d] = tok.split(':'), dur = Number(d) * u;
    if (!(dur > 0)) throw new Error(song.id + ': bad token ' + tok);
